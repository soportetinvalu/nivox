name: Nivox call audio arm64 (manual, no release)
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: nivox-callaudio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Installer transaction regression tests (sandbox, no HAL installation)
        run: python3 callaudio/tests/test_installer.py
      - name: Pinned dependency compatibility regression (no SDK or installation)
        run: python3 callaudio/tests/test_build_compat.py
      - name: CLI recovery verifier (real Mac stderr and negative probes)
        run: python3 callaudio/tests/test_cli_recovery.py
      - name: UI diagnostic orchestration regression (not native rendering)
        run: python3 tests/test_call_ui_diagnostics.py
      - name: E2E diagnostic classification regression (failures stay failures)
        run: python3 callaudio/tests/test_e2e_classification.py
      - name: Call controller lifecycle (release, ASan+UBSan, readiness counterprobe)
        run: python3 tests/test_call_audio.py --out build/call-ui-control
      - name: Core tests (release + RT allocation guard, ASan+UBSan, TSan)
        run: python3 callaudio/tools/build_callaudio.py --target linux --out build/callaudio-linux
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nivox-callaudio-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/callaudio-linux/report.json
            build/callaudio-linux/commands.log
            build/callaudio-linux/SHA256SUMS
            build/callaudio-linux/test_call_control
            build/callaudio-linux/test_core
            build/callaudio-linux/test_core_asan
            build/callaudio-linux/test_core_tsan
            build/call-ui-control/report.json
            build/call-ui-control/commands.log
          if-no-files-found: error
          retention-days: 7
  mac-arm64:
    needs: linux-core
    if: github.event_name == 'workflow_dispatch'
    # Standard, free for this public repo; macos-15 failed runner acquisition.
    # macos-26 previously ran here; use one bounded alternative, not a retry matrix.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require GitHub-hosted ephemeral Apple Silicon runner
        id: ephemeral
        shell: bash
        run: |
          [[ "${GITHUB_ACTIONS:-}" == "true" && "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]] || { echo 'refusing: only on GitHub-hosted runners'; exit 1; }
          [[ ! -e /Library/Audio/Plug-Ins/HAL/NivoxAudio.driver ]] || { echo 'refusing: runner already has Nivox installed'; exit 1; }
      - name: Swift C lifecycle type regression (real compiler, positive and negative cases)
        run: python3 tests/test_call_lifecycle_swift.py --out build/lifecycle-swift-mac
      - name: Require Apple Silicon, build app + driver + engine, sign ad hoc, package
        id: mac_build
        shell: bash
        run: |
          [[ "$(uname -s)" == "Darwin" && "$(uname -m)" == "arm64" ]] || { echo 'BLOQUEADO: Darwin arm64 required'; exit 1; }
          python3 callaudio/tools/build_callaudio.py --target mac --out build/callaudio-mac
      - name: Production SwiftUI text visibility and real HAL checks (driver absent, TCC unchanged)
        id: ui_absent
        run: python3 tests/test_call_ui_mac.py --build build/callaudio-mac --out build/ui-mac-absent --driver absent
      - name: E2E on the ephemeral runner (installs the plug-in on the CI VM only)
        id: install_e2e
        # A UI diagnostic failure must not suppress the installed-driver matrix.
        # Its failed step still makes the job fail; no continue-on-error.
        if: ${{ !cancelled() && steps.ephemeral.outcome == 'success' && steps.mac_build.outcome == 'success' }}
        shell: bash
        run: |
          [[ "${GITHUB_ACTIONS:-}" == "true" && "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]] || { echo 'refusing: only on GitHub-hosted runners'; exit 1; }
          out=build/callaudio-mac
          stage="$out/zip-extracted/Nivox-CallAudio"
          sudo bash "$stage/install-driver.sh" | tee "$out/install.log"
          mkdir "$out/invalid.driver"
          if sudo bash "$stage/manage-driver.sh" install "$out/invalid.driver" > "$out/rejected-install.log" 2>&1; then
            echo 'invalid unsigned candidate was accepted'; exit 1
          fi
          sudo cmp "$out/NivoxAudio.driver/Contents/MacOS/NivoxAudio" /Library/Audio/Plug-Ins/HAL/NivoxAudio.driver/Contents/MacOS/NivoxAudio
          sudo bash "$stage/install-driver.sh" | tee "$out/replace.log"
          backup="$(python3 -c 'import re,sys; print(re.search(r"retained backup: (.*)", open(sys.argv[1]).read())[1])' "$out/replace.log")"
          sudo test -d "$backup"
          sudo bash "$stage/restore-driver.sh" "$backup" | tee "$out/restore.log"
          sudo test -d "$backup"
          found=0
          for i in $(seq 1 40); do
            if "$out/nivox-callaudio" --list > "$out/devices.json" 2>/dev/null && grep -q 'nivox.microphone.v1' "$out/devices.json"; then found=1; break; fi
            sleep 1
          done
          [[ "$found" == "1" ]] || { echo 'driver not loaded by coreaudiod'; cat "$out/devices.json" || true; exit 1; }
          mkdir "$out/e2e-captures"
          rc=0; NV_E2E_DIAGNOSTICS="$out/e2e-captures" "$out/nv-e2e" > "$out/e2e.json" 2> "$out/e2e.stderr" || rc=$?
          printf '%s\n' "$rc" > "$out/e2e.exitcode"
          cat "$out/e2e.json"
          [[ "$rc" == "0" ]] || { echo "nv-e2e failed ($rc)"; exit 1; }
          rc=0; "$out/nivox-callaudio" --no-mic --out-uid nivox.mic-feed.v1 --seconds 4 2> "$out/cli-smoke.jsonl" || rc=$?
          cat "$out/cli-smoke.jsonl"
          [[ "$rc" == "0" ]] && grep -q '"event":"started"' "$out/cli-smoke.jsonl" || { echo 'CLI smoke failed'; exit 1; }
      - name: Recover virtual paths after coreaudiod restart (runner only)
        if: ${{ !cancelled() && steps.install_e2e.outcome == 'success' }}
        shell: bash
        run: |
          [[ "${GITHUB_ACTIONS:-}" == "true" && "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]] || exit 1
          out=build/callaudio-mac
          "$out/nivox-callaudio" --no-mic --out-uid nivox.mic-feed.v1 --seconds 18 2> "$out/cli-recovery.jsonl" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 4
          grep -q '"event":"started"' "$out/cli-recovery.jsonl"
          sudo killall coreaudiod
          wait "$pid"
          trap - EXIT
          python3 callaudio/tools/verify_cli_recovery.py "$out/cli-recovery.jsonl" --report "$out/cli-recovery-report.json"
      - name: Production SwiftUI text visibility and real HAL checks (driver installed, no physical capture)
        # Try even if an E2E/recovery assertion failed after installation. The
        # filesystem preflight and the real HAL phase guard remain mandatory.
        if: ${{ !cancelled() && steps.ephemeral.outcome == 'success' && steps.mac_build.outcome == 'success' && (steps.install_e2e.outcome == 'success' || steps.install_e2e.outcome == 'failure') }}
        shell: bash
        run: |
          [[ "${GITHUB_ACTIONS:-}" == "true" && "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]] || exit 1
          [[ -d /Library/Audio/Plug-Ins/HAL/NivoxAudio.driver ]] || { echo 'BLOQUEADO: installed-driver UI matrix requires the real plug-in'; exit 1; }
          python3 tests/test_call_ui_mac.py --build build/callaudio-mac --out build/ui-mac-present --driver present
      - name: Protected uninstall (runner only)
        if: always()
        shell: bash
        run: |
          [[ "${GITHUB_ACTIONS:-}" == "true" && "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]] || exit 1
          out=build/callaudio-mac
          stage="$out/zip-extracted/Nivox-CallAudio"
          if [[ -f "$out/install.log" && -d /Library/Audio/Plug-Ins/HAL/NivoxAudio.driver ]]; then
            sudo bash "$stage/uninstall-driver.sh" | tee "$out/uninstall.log"
            [[ ! -e /Library/Audio/Plug-Ins/HAL/NivoxAudio.driver ]]
          fi
      - name: CoreAudio logs for diagnosis
        if: always()
        shell: bash
        run: |
          log show --last 5m --style compact --predicate 'process == "coreaudiod" OR process CONTAINS "Core-Audio-Driver-Service"' > build/callaudio-mac/coreaudio.log 2>&1 || true
          tail -n 80 build/callaudio-mac/coreaudio.log || true
      - name: Classify E2E diagnostics without waiving the failed audio assertions
        if: ${{ always() && steps.mac_build.outcome == 'success' }}
        run: python3 callaudio/tools/classify_e2e.py build/callaudio-mac --report build/callaudio-mac/e2e-diagnosis.json
      - name: Retain ad hoc build and evidence (not a Release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nivox-callaudio-arm64-adhoc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/callaudio-mac/Nivox-CallAudio-arm64-adhoc.zip
            build/callaudio-mac/report.json
            build/callaudio-mac/commands.log
            build/callaudio-mac/SHA256SUMS
            build/callaudio-mac/libASPL.a
            build/callaudio-mac/nivox-callaudio
            build/callaudio-mac/nv-e2e
            build/callaudio-mac/nv-hal-test
            build/callaudio-mac/nv_driver_core.o
            build/callaudio-mac/test_core
            build/callaudio-mac/devices.json
            build/callaudio-mac/e2e.json
            build/callaudio-mac/e2e.stderr
            build/callaudio-mac/e2e.exitcode
            build/callaudio-mac/e2e-diagnosis.json
            build/callaudio-mac/e2e-captures/
            build/callaudio-mac/cli-smoke.jsonl
            build/callaudio-mac/cli-recovery.jsonl
            build/callaudio-mac/cli-recovery-report.json
            build/callaudio-mac/coreaudio.log
            build/callaudio-mac/*.log
            build/callaudio-mac/app-build/report.json
            build/callaudio-mac/app-build/commands.log
            build/lifecycle-swift-mac/report.json
            build/lifecycle-swift-mac/commands.log
            build/ui-mac-absent/
            build/ui-mac-present/
          if-no-files-found: warn
          retention-days: 7
